on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # Add your build steps below
